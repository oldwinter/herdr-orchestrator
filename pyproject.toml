[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-orchestrator"
version = "0.1.1"
description = "Durable multi-harness workflow orchestration over Herdr"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "oldwinter" }]
dependencies = []

[project.scripts]
herdr-orchestrator = "herdr_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"herdr_orchestrator.dashboard.static" = ["*.html", "*.css", "*.js", "*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
target-version = ["py312"]
line-length = 100
