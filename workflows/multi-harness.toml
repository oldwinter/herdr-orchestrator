schema_version = 1
name = "multi-harness"
workspace = ".."
state_db = "../.orchestrator/state.db"
profiles_dir = "../profiles/harnesses"

[coordinator]
poll_seconds = 5
max_parallel = 6
lease_seconds = 32400
max_attempts = 2
agent_timeout_seconds = 28800

[placement]
mode = "hybrid"
worktree_root = ".orchestrator/worktrees"

[standardized_delivery]
tracker_backend = "local-markdown"
tracker_root = ".scratch/standardized-delivery"
artifact_root = ".orchestrator/deliveries"
wayfinder = "auto"
max_parallel = 3
review_repair_rounds = 2

[planner]
enabled = false
harness = "auto"
worker_harnesses = ["droid", "grok", "codex", "pi", "claude", "hermes"]
interval_seconds = 1800
prompt_file = "prompts/planner.md"
output_file = "../.orchestrator/plans/multi-harness.json"
max_tasks = 20

[[workers]]
name = "operations"
harness = "droid"

[[workers]]
name = "grok-build"
harness = "grok"

[[workers]]
name = "implementation"
harness = "codex"

[[workers]]
name = "quick-analysis"
harness = "pi"

[[workers]]
name = "deep-review"
harness = "claude"

[[workers]]
name = "research"
harness = "hermes"

[[seed_jobs]]
title = "Droid workflow inventory"
harness = "droid"
prompt_file = "prompts/droid-inventory.md"
dedupe_key = "droid-inventory-v1"

[[seed_jobs]]
title = "Codex architecture review"
harness = "codex"
prompt_file = "prompts/codex-architecture.md"
dedupe_key = "codex-architecture-v1"

[[seed_jobs]]
title = "pi configuration check"
harness = "pi"
prompt_file = "prompts/pi-config-check.md"
dedupe_key = "pi-config-check-v1"

[[seed_jobs]]
title = "Claude safety review"
harness = "claude"
prompt_file = "prompts/claude-safety.md"
dedupe_key = "claude-safety-v1"

[[seed_jobs]]
title = "Hermes documentation synthesis"
harness = "hermes"
prompt_file = "prompts/hermes-docs.md"
dedupe_key = "hermes-docs-v1"

[[seed_jobs]]
title = "Grok Build catalog contract check"
harness = "grok"
prompt_file = "prompts/grok-build-check.md"
dedupe_key = "grok-build-catalog-v1"
