schema_version = 1
name = "grok-burst"
workspace = ".."
state_db = "../.orchestrator/grok-burst.db"

[coordinator]
poll_seconds = 15
max_parallel = 12
lease_seconds = 14400
max_attempts = 2
agent_timeout_seconds = 10800

[placement]
mode = "hybrid"
worktree_root = ".orchestrator/worktrees"

[planner]
enabled = true
harness = "grok"
worker_harnesses = ["grok"]
interval_seconds = 120
prompt_file = "prompts/planner-grok-burst.md"
output_file = "../.orchestrator/plans/grok-burst.json"
max_tasks = 8

[[workers]]
name = "grok-burst"
harness = "grok"
replicas = 12
capabilities = ["architecture", "experience", "design", "github-issues", "local-improvement"]
placement = "tab"

[[seed_jobs]]
title = "hctl: 架构 issue and local architecture fix"
harness = "grok"
prompt_file = "prompts/grok-burst-hctl.md"
dedupe_key = "grok-burst-hctl-v1"
placement = "tab"

[[seed_jobs]]
title = "all-cli: 体验 issue and local UX fix"
harness = "grok"
prompt_file = "prompts/grok-burst-all-cli.md"
