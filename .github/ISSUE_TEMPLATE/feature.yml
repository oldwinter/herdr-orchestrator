name: Feature request
description: Propose a scoped improvement
title: "[Feature] "
labels: ["type:feature", "priority:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user outcome rather than an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and recovery
      description: Note migrations, external effects, privacy, and rollback.
    validations:
      required: true
