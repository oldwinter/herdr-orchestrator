name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: ["type:bug", "priority:triage"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include stable error codes and sanitized output only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Do not include prompts, terminal transcripts, tokens, or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - coordinator
        - dashboard
        - delivery
        - distribution
        - documentation
        - security
    validations:
      required: true
