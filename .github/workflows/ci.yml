name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      security: ${{ steps.security.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked toolchain
        run: |
          npm install --global rust-just@1.57.0
          uv sync --locked
      - name: Compile
        run: PYTHONPATH=src uv run python -m compileall -q src tests scripts
      - name: Static quality gates
        id: lint
        continue-on-error: true
        run: just lint
      - name: Branch-aware coverage
        id: coverage
        continue-on-error: true
        run: just test-coverage
      - name: Flaky-test detection
        id: stability
        continue-on-error: true
        run: just test-stability
      - name: Security review
        id: security
        continue-on-error: true
        run: just security
      - name: Package build metrics
        id: build
        continue-on-error: true
        run: just build-metrics
      - name: Profiling evidence
        id: profiling
        continue-on-error: true
        run: just profile-tests
      - name: Generate quality review
        if: always()
        run: just quality-summary
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ github.run_id }}
          path: .orchestrator/quality/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce all outcomes
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          LINT: ${{ steps.lint.outcome }}
          PROFILING: ${{ steps.profiling.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          STABILITY: ${{ steps.stability.outcome }}
        run: |
          printf 'lint=%s coverage=%s stability=%s security=%s build=%s profiling=%s\n' \
            "$LINT" "$COVERAGE" "$STABILITY" "$SECURITY" "$BUILD" "$PROFILING"
          test "$LINT" = success
          test "$COVERAGE" = success
          test "$STABILITY" = success
          test "$SECURITY" = success
          test "$BUILD" = success
          test "$PROFILING" = success

  pr-review:
    if: always() && github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download quality evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-${{ github.run_id }}
          path: quality
      - name: Post automated review
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test.result }}
        run: |
          {
            printf '## Automated quality review\n\n'
            printf 'Overall gate: **%s**\n\n' "$RESULT"
            if test -f quality/summary.md; then
              tail -n +2 quality/summary.md
            else
              printf 'Quality artifacts were unavailable. Inspect the `test` job logs.\n'
            fi
          } > /tmp/quality-review.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body-file /tmp/quality-review.md

  security-insight:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.outputs.security == 'failure'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update security insight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automated security gate failure"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if test -n "$issue"; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
              --body "Security checks failed again on \`$GITHUB_SHA\`: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label security --label area:ci --label priority:high \
              --body "Security checks failed on \`$GITHUB_SHA\`: $run_url"
          fi

  release-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, Linux, X64, herdr-orchestrator]
    timeout-minutes: 5
    outputs:
      manager_publish: ${{ steps.manager.outputs.publish }}
      orchestrator_publish: ${{ steps.orchestrator.outputs.publish }}
      orchestrator_version: ${{ steps.orchestrator.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Plan orchestrator release
        id: orchestrator
        run: node scripts/npm-release-plan.mjs --package-json package.json
      - name: Plan manager release
        id: manager
        run: node scripts/npm-release-plan.mjs --package-json packages/herdr-manager/package.json

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.release-plan.outputs.orchestrator_publish == 'true' ||
        needs.release-plan.outputs.manager_publish == 'true'
      )
    needs: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use OIDC-capable npm
        run: npm install --global npm@12.0.2
      - name: Install package metadata
        run: npm ci --ignore-scripts
      - name: Publish orchestrator package
        if: needs.release-plan.outputs.orchestrator_publish == 'true'
        run: npm publish --access public
      - name: Publish manager package
        if: needs.release-plan.outputs.manager_publish == 'true'
        run: npm publish --access public ./packages/herdr-manager
      - name: Generate GitHub release notes
        if: needs.release-plan.outputs.orchestrator_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-plan.outputs.orchestrator_version }}
        run: >-
          gh release create "v$VERSION"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "v$VERSION"
          --generate-notes
