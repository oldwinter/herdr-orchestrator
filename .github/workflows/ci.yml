name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Use OIDC-capable npm
        run: npm install --global npm@12.0.2
      - name: Install package metadata
        run: npm ci --ignore-scripts
      - name: Plan release
        id: plan
        run: node scripts/npm-release-plan.mjs --package-json package.json
      - name: Publish package
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --access public --provenance
