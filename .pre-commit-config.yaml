minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: quality-fast
        name: Repository quality gates
        entry: just lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: secrets
        name: Secret scan
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        stages: [pre-commit]
      - id: tests
        name: Tests with coverage
        entry: just test-coverage
        language: system
        pass_filenames: false
        stages: [pre-push]
